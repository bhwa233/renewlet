name: Cloudflare Worker

# fork 用户和维护者测试环境共用的自管部署入口；缺少 secrets 时只跳过远端部署，仍保留构建验证。
on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # dev 与稳定 tag 可能共用同一远端 D1；migration/backfill/deploy 必须跨 workflow 串行，不能取消正在写库的 run。
  group: production-cloudflare-${{ github.repository }}
  cancel-in-progress: false

env:
  CI_WRANGLER_CONFIG: wrangler.generated.jsonc
  CI_WRANGLER_MAINTENANCE_CONFIG: wrangler.maintenance.generated.jsonc
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORKER_NAME: ${{ secrets.WORKER_NAME }}
  D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  CLOUDFLARE_OBSERVABILITY_PROFILE: development
  RENEWLET_COMMIT: ${{ github.sha }}
  # fork 自管部署要求每次 push 都必须真正落到 Cloudflare；开启后缺 secrets 直接失败，避免绿色空转。
  REQUIRE_CLOUDFLARE_DEPLOY: ${{ vars.REQUIRE_CLOUDFLARE_DEPLOY }}

jobs:
  deploy:
    # 官方生产 Worker 只能由 Release Publish 的 tag job 覆盖；自管入口在官方仓库只跑 dev，fork/main 仍保留同步部署路径。
    if: ${{ github.repository != 'zhiyingzzhou/renewlet' || github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve build metadata
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="${GITHUB_SHA::7}"
          {
            echo "RENEWLET_VERSION=${PACKAGE_VERSION}-dev+${SHORT_SHA}"
            echo "RENEWLET_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - name: Check Cloudflare build
        run: pnpm check:cloudflare

      - name: Build Cloudflare assets
        run: pnpm build:cloudflare

      - name: Check deployment secrets
        id: deployment-secrets
        shell: bash
        # fork/私有测试环境常缺远端 secrets；这里降级为 notice，保留构建检查但不碰真实 D1/R2。
        run: |
          set -euo pipefail

          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID WORKER_NAME D1_DATABASE_ID R2_BUCKET_NAME; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            printf -v missing_list '%s, ' "${missing[@]}"
            missing_list="${missing_list%, }"
            if [[ "${REQUIRE_CLOUDFLARE_DEPLOY:-}" == "true" ]]; then
              echo "::error title=Cloudflare deploy blocked::Missing GitHub Actions secrets: ${missing_list}. This repository requires remote deploy (REQUIRE_CLOUDFLARE_DEPLOY=true): builds passed but nothing was published."
              exit 1
            fi
            echo "::notice title=Cloudflare deploy skipped::Missing GitHub Actions secrets: ${missing_list}. Build checks passed; add all required secrets to enable remote D1 migration and Worker deploy."
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Generate Cloudflare config
        if: steps.deployment-secrets.outputs.ready == 'true'
        run: pnpm cloudflare:config:ci

      - name: Deploy Renewlet through the exclusive migration orchestrator
        if: steps.deployment-secrets.outputs.ready == 'true'
        run: pnpm deploy -- --config "$CI_WRANGLER_CONFIG" --maintenance-config "$CI_WRANGLER_MAINTENANCE_CONFIG"

      - name: Summarize deployment outcome
        if: always()
        shell: bash
        env:
          READY: ${{ steps.deployment-secrets.outputs.ready }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Cloudflare Worker 部署结论"
            echo
            if [[ "${JOB_STATUS}" != "success" ]]; then
              echo "- 结果：**失败或取消** — 线上未被本次运行改动，请查看上方失败步骤。"
            elif [[ "${READY}" == "true" ]]; then
              echo "- 结果：**已执行 D1 迁移并部署** \`${RENEWLET_VERSION:-unknown}\`（\`${GITHUB_SHA:0:7}\`）"
            else
              echo "- 结果：**未部署** — 缺少 Cloudflare secrets，本次只做了构建校验。"
            fi
            echo "- 触发：\`${GITHUB_EVENT_NAME}\` · 分支 \`${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
